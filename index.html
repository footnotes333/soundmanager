<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sound Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Sound Manager</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111;--mut:#8a8a8e;--ac:#0a84ff;--tr:#d1d1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mut:#8e8e93;--tr:#3a3a3c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;padding:16px 16px 40px}
h1{font-size:30px;margin:8px 4px 0}
.sub{color:var(--mut);font-size:13px;margin:2px 4px 16px;display:inline-block;padding:6px 4px}
.card{background:var(--card);border-radius:16px;padding:6px 16px;margin-bottom:16px}
.row{padding:12px 0;border-bottom:1px solid var(--tr)}.row:last-child{border:0}
.lab{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px}.lab span:last-child{color:var(--mut)}
.sl{position:relative;height:30px;touch-action:none}
.sl .t{position:absolute;top:13px;left:0;right:0;height:5px;border-radius:3px;background:var(--tr)}
.sl .f{position:absolute;top:13px;left:0;height:5px;border-radius:3px;background:var(--ac)}
.sl .k{position:absolute;top:2px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;margin:4px 8px 8px;font-weight:600}
.eq{display:flex;justify-content:space-between;padding:14px 0}
.band{width:18%;text-align:center;font-size:12px;color:var(--mut)}
.v{position:relative;height:150px;touch-action:none;margin-bottom:6px}
.v .t{position:absolute;left:50%;margin-left:-2px;width:5px;top:0;bottom:0;border-radius:3px;background:var(--tr)}
.v .f{position:absolute;left:50%;margin-left:-2px;width:5px;bottom:0;border-radius:3px;background:var(--ac)}
.v .k{position:absolute;left:50%;margin-left:-13px;width:26px;height:26px;margin-bottom:-13px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.pre{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.pre button{border:0;background:var(--tr);color:var(--tx);padding:9px 16px;border-radius:20px;font-size:14px;white-space:nowrap}
.pre button.on{background:var(--ac);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.tg{width:50px;height:30px;border-radius:15px;background:var(--tr);position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:#34c759}.tg.on::after{left:22px}
#ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:24px}
#ov.show{display:flex}
.dots{display:flex;gap:16px;margin:20px 0 8px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--tx)}.dots i.f{background:var(--tx)}
#msg{color:var(--mut);height:20px;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:20px}
.pad button{height:76px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:28px}
.pad button:active{background:var(--tr)}
.lk{border:0;background:none;color:var(--ac);font-size:16px;margin-top:24px}
#inside{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;padding:24px;text-align:center;padding-top:30vh}
#inside.show{display:block}
input{-webkit-user-select:text;user-select:text;font-size:17px;padding:13px;border-radius:12px;border:1px solid var(--tr);background:var(--card);color:var(--tx);width:100%;margin:6px 0}
#inside{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));text-align:left;overflow:hidden;overscroll-behavior:none}
#inside.show{display:flex;flex-direction:column}
.pane{display:none}.pane.on{display:block}
#auth.on,#home.on{overflow:auto;flex:1;min-height:0}
#chat.on{display:flex;flex-direction:column;flex:1;min-height:0}
#msgs{min-height:0}
.btn{border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;padding:13px;width:100%;margin-top:6px}.btn.sec{background:var(--tr);color:var(--tx)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.bar button{border:0;background:none;color:var(--ac);font-size:16px;margin-left:12px;padding:0}
.add,.send{display:flex;gap:8px}.add input,.send input{margin:0}.add .btn,.send .btn{width:84px;margin:0}
.ct{padding:14px;background:var(--card);border-radius:12px;margin-top:8px;font-size:17px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.m{max-width:78%;padding:9px 13px;border-radius:18px;font-size:16px;word-wrap:break-word}.m.me{align-self:flex-end;background:var(--ac);color:#fff}.m.th{align-self:flex-start;background:var(--card)}
#aerr{color:#ff453a;min-height:20px;margin:8px 0;font-size:14px}
</style>
</head>
<body>
<h1>Sound</h1>
<div class="sub" id="secret">Audio manager</div>

<h2>Volume</h2>
<div class="card" id="vols"></div>

<h2>Equaliser</h2>
<div class="card">
  <div class="pre" id="pre"></div>
  <div class="eq" id="eq"></div>
</div>

<h2>Enhancements</h2>
<div class="card">
  <div class="sw"><span>Bass boost</span><div class="tg"></div></div>
  <div class="sw"><span>Virtual surround</span><div class="tg"></div></div>
  <div class="sw"><span>Loudness enhancer</span><div class="tg on"></div></div>
</div>

<div id="ov">
  <div id="ttl" style="font-size:20px">Enter PIN</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div id="msg"></div>
  <div class="pad" id="pad"></div>
  <button class="lk" id="cancel">Cancel</button>
</div>

<div id="inside">
  <div class="pane on" id="auth">
    <h1>Welcome</h1>
    <input id="un" placeholder="Username" autocapitalize="none" autocorrect="off" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div id="aerr"></div>
    <button class="btn" id="login">Log in</button>
    <button class="btn sec" id="signup">Create account</button>
    <button class="lk" id="lock">Lock</button>
  </div>
  <div class="pane" id="home">
    <div class="bar"><b id="me"></b><span><button id="out">Log out</button><button id="lock2">Lock</button></span></div>
    <div class="add"><input id="who" placeholder="Friend's username" autocapitalize="none" autocorrect="off"><button class="btn" id="addb">Add</button></div>
    <div id="aerr2" style="color:#ff453a;font-size:14px;min-height:20px;margin-top:6px"></div>
    <button class="btn sec" id="notif" style="margin-top:6px;display:none">Enable sound alerts</button>
    <div id="list"></div>
  </div>
  <div class="pane" id="chat">
    <div class="bar"><button id="back" style="margin:0">‹ Back</button><b id="peer"></b><span></span></div>
    <div id="msgs"></div>
    <div class="send"><input id="txt" placeholder="Message"><button class="btn" id="sendb">Send</button></div>
  </div>
</div>

<script>
var $=function(s){return document.querySelector(s)};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return window['_'+k]=v===undefined?window['_'+k]:v}}
function drag(el,vert,cb){
  function mv(e){var r=el.getBoundingClientRect();var p=vert?1-(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;cb(Math.max(0,Math.min(1,p)))}
  el.addEventListener('pointerdown',function(e){el.setPointerCapture(e.pointerId);mv(e);el.onpointermove=mv});
  el.addEventListener('pointerup',function(){el.onpointermove=null});
}
var vols=[["Ringtone",70],["Calls",55],["Notifications",40],["Alarm",80],["Media",60],["System sounds",30],["Vibration intensity",50]];
vols.forEach(function(v){
  var d=document.createElement('div');d.className='row';
  d.innerHTML='<div class="lab"><span>'+v[0]+'</span><span>'+v[1]+'%</span></div><div class="sl"><div class="t"></div><div class="f"></div><div class="k"></div></div>';
  $('#vols').appendChild(d);
  var f=d.querySelector('.f'),k=d.querySelector('.k'),n=d.querySelector('.lab span:last-child'),s=d.querySelector('.sl');
  function set(p){f.style.width=p*100+'%';k.style.left=p*100+'%';n.textContent=Math.round(p*100)+'%'}
  set(v[1]/100);drag(s,false,function(p){set(p);if(navigator.vibrate)navigator.vibrate(5)});
});
var bands=["60Hz","230Hz","910Hz","4kHz","14kHz"];
var presets={Flat:[50,50,50,50,50],Bass:[85,70,50,45,40],Rock:[70,55,40,60,75],Pop:[40,60,70,60,45],Vocal:[30,45,75,70,50],Treble:[35,40,50,75,90]};
var setters=[];
bands.forEach(function(b,i){
  var d=document.createElement('div');d.className='band';
  d.innerHTML='<div class="v"><div class="t"></div><div class="f"></div><div class="k"></div></div>'+b;
  $('#eq').appendChild(d);
  var f=d.querySelector('.f'),k=d.querySelector('.k');
  function set(p){f.style.height=p*100+'%';k.style.bottom=p*100+'%'}
  setters.push(set);set(.5);
  drag(d.querySelector('.v'),true,function(p){set(p);document.querySelectorAll('#pre button').forEach(function(x){x.classList.remove('on')})});
});
Object.keys(presets).forEach(function(n,i){
  var b=document.createElement('button');b.textContent=n;if(i==0)b.className='on';
  b.onclick=function(){document.querySelectorAll('#pre button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');presets[n].forEach(function(v,j){setters[j](v/100)})};
  $('#pre').appendChild(b);
});
document.querySelectorAll('.tg').forEach(function(t){t.onclick=function(){t.classList.toggle('on')}});

// Hidden entrance: long-press the small subtitle
var timer;
var sec=$('#secret');
function startP(){timer=setTimeout(openPin,1000)}function stopP(){clearTimeout(timer)}
sec.addEventListener('touchstart',startP,{passive:true});sec.addEventListener('touchend',stopP);sec.addEventListener('touchmove',stopP);
sec.addEventListener('mousedown',startP);sec.addEventListener('mouseup',stopP);sec.addEventListener('mouseleave',stopP);

var entry='',first='',mode='';
"123456789 0<".split('').forEach(function(c){
  var b=document.createElement('button');
  if(c==' '){b.style.visibility='hidden'}else{b.textContent=c=='<'?'⌫':c;b.onclick=function(){press(c)}}
  $('#pad').appendChild(b);
});
function draw(){document.querySelectorAll('#dots i').forEach(function(d,i){d.className=i<entry.length?'f':''})}
function openPin(){
  entry='';first='';draw();$('#msg').textContent='';
  mode=store('pin')?'verify':'create';
  $('#ttl').textContent=mode=='create'?'Create a 4-digit PIN':'Enter PIN';
  $('#ov').classList.add('show');
}
function press(c){
  if(c=='<'){entry=entry.slice(0,-1);draw();return}
  if(entry.length>=4)return;
  entry+=c;draw();
  if(entry.length==4)setTimeout(check,150);
}
function check(){
  if(mode=='create'){first=entry;entry='';mode='confirm';$('#ttl').textContent='Confirm PIN';draw();return}
  if(mode=='confirm'){
    if(entry===first){store('pin',entry);unlock()}else{$('#msg').textContent="PINs didn't match";entry='';first='';mode='create';$('#ttl').textContent='Create a 4-digit PIN';draw()}
    return}
  if(entry===store('pin'))unlock();else{$('#msg').textContent='Wrong PIN';entry='';draw()}
}
function unlock(){$('#ov').classList.remove('show');$('#inside').classList.add('show')}
$('#cancel').onclick=function(){$('#ov').classList.remove('show')};
$('#lock').onclick=function(){$('#inside').classList.remove('show')};
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,arrayUnion,addDoc,deleteDoc,collection,query,orderBy,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getMessaging,getToken} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
const cfg={apiKey:"AIzaSyCHyraoGgU2fB7LOrpfLZu97Onyg-0hZv8",authDomain:"soundmanager-app.firebaseapp.com",projectId:"soundmanager-app",storageBucket:"soundmanager-app.firebasestorage.app",messagingSenderId:"1043524666493",appId:"1:1043524666493:web:3826037c1385455cff9d14"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const Q=s=>document.querySelector(s),D='@soundmgr.app';
let me=null,unsub=null,timers={},kp=null,myPub='';
const b64=function(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))},ub=function(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})};
function idb(){return new Promise(function(r,j){var q=indexedDB.open('sm',1);q.onupgradeneeded=function(){q.result.createObjectStore('k')};q.onsuccess=function(){r(q.result)};q.onerror=j})}
async function kget(k){var d=await idb();return new Promise(function(r){var q=d.transaction('k').objectStore('k').get(k);q.onsuccess=function(){r(q.result)};q.onerror=function(){r()}})}
async function kset(k,v){var d=await idb();return new Promise(function(r){var t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=r})}
async function ensureKeys(){
  kp=await kget('k_'+me.uid);
  if(!kp){kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);await kset('k_'+me.uid,kp)}
  myPub=b64(await crypto.subtle.exportKey('raw',kp.publicKey));
  await setDoc(doc(db,'usernames',me.email.split('@')[0]),{uid:me.uid,pub:myPub},{merge:true});
}
async function shared(pp){var pk=await crypto.subtle.importKey('raw',ub(pp),{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(key,t){var iv=crypto.getRandomValues(new Uint8Array(12));var c=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(t));return{iv:b64(iv),ct:b64(c)}}
async function dec(key,m){try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(m.iv)},key,ub(m.ct)))}catch(e){return '\u{1F512} Cannot decrypt'}}
async function safety(a,b){var h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode([a,b].sort().join('|'))));return Array.from(h.slice(0,6)).map(function(x){return String(x).padStart(3,'0')}).join(' ')}
function pane(id){['auth','home','chat'].forEach(function(p){Q('#'+p).classList.toggle('on',p==id)})}
function err(e,el){var m={'auth/invalid-credential':'Wrong username or password','auth/email-already-in-use':'Username already taken','auth/weak-password':'Password needs 6+ characters','auth/network-request-failed':'No connection','auth/invalid-api-key':'App key is wrong','auth/operation-not-allowed':'Email/Password sign-in is not switched on in Firebase'};Q(el||'#aerr').textContent=typeof e=='string'?e:(m[e.code]||e.code||'Something went wrong')}
const nm=function(){return Q('#un').value.trim().toLowerCase()};
Q('#login').onclick=async function(){try{await signInWithEmailAndPassword(auth,nm()+D,Q('#pw').value)}catch(e){err(e)}};
Q('#signup').onclick=async function(){
  var n=nm(),p=Q('#pw').value;
  if(!/^[a-z0-9_]{3,20}$/.test(n))return err('Username: 3-20 letters, numbers or _');
  if(p.length<6)return err('Password needs 6+ characters');
  try{await createUserWithEmailAndPassword(auth,n+D,p)}catch(e){err(e)}
};
onAuthStateChanged(auth,function(u){
  me=u;
  if(u){Q('#me').textContent=u.email.split('@')[0];Q('#aerr').textContent='';pane('home');list();chkNotif();ensureKeys().catch(function(e){console.log(e)})}else pane('auth');
});
Q('#out').onclick=function(){signOut(auth)};
const VAPID="BIVIKDJQj0D71r8AalIlmb0ffcQWfngzl748gnt2QPGMY-7c-0x66nwHguNyAMoiCozPKFgGK0zHOCJmaTg1zg8";
async function enableAlerts(){
  try{
    var p=await Notification.requestPermission();if(p!=='granted')return;
    var reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');await navigator.serviceWorker.ready;
    var t=await getToken(getMessaging(app),{vapidKey:VAPID,serviceWorkerRegistration:reg});
    await setDoc(doc(db,'tokens',me.uid),{list:arrayUnion(t)},{merge:true});
    Q('#notif').style.display='none';
  }catch(e){Q('#aerr2').textContent='Alerts: '+(e.code||e.message)}
}
function chkNotif(){
  if(!('Notification' in window)||!('serviceWorker' in navigator))return;
  if(Notification.permission==='granted'){enableAlerts()}else if(Notification.permission==='default'){Q('#notif').style.display=''}
}
Q('#notif').onclick=enableAlerts;
Q('#lock2').onclick=function(){Q('#lock').click()};
document.addEventListener('visibilitychange',function(){if(document.hidden)Q('#lock').click()});
function cons(){try{return JSON.parse(localStorage.getItem('c_'+me.uid)||'[]')}catch(e){return[]}}
function list(){
  var L=Q('#list');L.innerHTML='';
  cons().forEach(function(c){var d=document.createElement('div');d.className='ct';d.textContent=c.n;d.onclick=function(){openChat(c)};L.appendChild(d)});
}
Q('#addb').onclick=async function(){
  var n=Q('#who').value.trim().toLowerCase();Q('#aerr2').textContent='';
  if(!n)return;
  try{
    var s=await getDoc(doc(db,'usernames',n));
    if(!s.exists())return err('No user with that name','#aerr2');
    var a=cons();if(!a.some(function(x){return x.n==n}))a.push({n:n,u:s.data().uid});
    localStorage.setItem('c_'+me.uid,JSON.stringify(a));Q('#who').value='';list();
  }catch(e){err(e,'#aerr2')}
};
var peerName='',peerPub='',gone={};
async function decN(key,m){try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(m.iv)},key,ub(m.ct)))}catch(e){return null}}
async function getKey(){
  var s=await getDoc(doc(db,'usernames',peerName));
  if(!s.exists()||!s.data().pub)return null;
  if(s.data().pub!==peerPub||!window._key){peerPub=s.data().pub;window._key=await shared(peerPub)}
  return window._key;
}
async function openChat(c){
  peerName=c.n;peerPub='';window._key=null;
  Q('#peer').textContent=c.n;pane('chat');var box=Q('#msgs');box.innerHTML='';
  if(!kp)await ensureKeys();
  var key=await getKey();
  if(!key){box.textContent='This user has not opened the updated app yet.';return}
  Q('#peer').onclick=async function(){alert('Safety code\n\n'+await safety(myPub,peerPub)+'\n\nCompare this with '+c.n+'. If it matches on both phones, nobody is intercepting.')};
  var cid=[me.uid,c.u].sort().join('_');window._cid=cid;
  var q=query(collection(db,'chats',cid,'messages'),orderBy('ts'));
  unsub=onSnapshot(q,async function(snap){
    var run=function(){return Promise.all(snap.docs.map(async function(d){var m=d.data();return{d:d,m:m,t:m.ct?await decN(window._key,m):null}}))};
    var items=await run();
    if(items.some(function(x){return x.m.ct&&x.t===null})){await getKey();items=await run()}
    box.innerHTML='';
    items.forEach(function(x){
      if(x.t===null){if(!gone[x.d.id]){gone[x.d.id]=1;deleteDoc(x.d.ref)}return}
      var el=document.createElement('div');el.className='m '+(x.m.from==me.uid?'me':'th');el.textContent=x.t;box.appendChild(el);
      if(x.m.from!==me.uid&&!timers[x.d.id]){timers[x.d.id]=setTimeout(function(){deleteDoc(x.d.ref)},5000)}
    });
    box.scrollTop=box.scrollHeight;
  });
}
Q('#back').onclick=function(){if(unsub)unsub();pane('home')};
async function send(){
  var t=Q('#txt').value.trim();if(!t)return;
  try{var key=await getKey();if(!key)return;Q('#txt').value='';var e=await enc(key,t);await addDoc(collection(db,'chats',window._cid,'messages'),{from:me.uid,iv:e.iv,ct:e.ct,ts:Date.now()})}catch(x){}
}
Q('#sendb').onclick=send;
function fit(){var v=window.visualViewport;if(!v)return;var e=Q('#inside');e.style.bottom='auto';e.style.top=v.offsetTop+'px';e.style.height=v.height+'px';e.style.paddingBottom=(v.height<window.innerHeight-120)?'8px':'';window.scrollTo(0,0);var b=Q('#msgs');b.scrollTop=b.scrollHeight}
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}
Q('#txt').addEventListener('focus',function(){setTimeout(fit,300)});
Q('#txt').addEventListener('keydown',function(e){if(e.key=='Enter')send()});
</script>
</body>
</html>
